name: Generate Mermaid Diagrams

on:
  push:
    branches:
      - main
      - byPods
    paths-ignore:
      - 'diagram-*.png'
  pull_request:
    branches:
      - main
      - byPods
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11.15.0

      - name: Generate diagrams
        run: |
          mmdc --input README.md --output diagram.md --outputFormat png
          rm diagram.md

      - name: Commit and push diagrams
        if: github.event_name != 'pull_request'
        run: |
          shopt -s nullglob
          diagrams=(diagram-*.png)
          if (( ${#diagrams[@]} == 0 )); then
            echo "::error::No Mermaid diagrams were generated."
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${diagrams[@]}"

          if git diff --cached --quiet; then
            echo "No diagram changes to commit."
            exit 0
          fi

          git commit -m 'Auto-generate Mermaid diagrams'
          git push origin "HEAD:${GITHUB_REF_NAME}"
