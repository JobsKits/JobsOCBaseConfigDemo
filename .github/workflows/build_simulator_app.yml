name: Build Simulator App

on:
  push:
    branches:
      - main
      - byPods
  pull_request:
    branches:
      - main
      - byPods
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator-app:
    runs-on: xcode-27
    timeout-minutes: 150
    permissions:
      actions: write
      contents: read

    env:
      WORKSPACE: JobsOCBaseConfigDemo.xcworkspace
      SCHEME: JobsOCBaseConfigDemo
      CONFIGURATION: Debug
      SDK: iphonesimulator
      JOBS_POD_INSTALL_SKIP_VENDOR_PATCHES: '1'
      DESTINATION: generic/platform=iOS Simulator
      SIMULATOR_ARCH: arm64
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 27.1 SDK
        run: |
          diagnostics_path="${RUNNER_TEMP}/BuildDiagnostics"
          mkdir -p "${diagnostics_path}"
          selected_developer_dir="${XCODE_27_1_DEVELOPER_DIR:-/Applications/Xcode_27.1.app/Contents/Developer}"
          if [[ ! -d "${selected_developer_dir}" ]]; then
            echo "::error::Xcode 27.1 is required but is unavailable on the runner: ${selected_developer_dir}"
            exit 1
          fi
          export DEVELOPER_DIR="${selected_developer_dir}"
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> "${GITHUB_ENV}"
          xcodebuild -version | tee "${diagnostics_path}/xcode-version.txt"
          grep -Eq '^Xcode 27[.]1([.]|$)' "${diagnostics_path}/xcode-version.txt"
          simulator_sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          echo "iOS Simulator SDK: ${simulator_sdk_version}" | tee "${diagnostics_path}/simulator-sdk-version.txt"
          ruby -rrubygems -e 'abort "iOS Simulator SDK 27.1 or newer is required" if Gem::Version.new(ARGV.fetch(0)) < Gem::Version.new("27.1")' "${simulator_sdk_version}"
          xcode-select -p

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          pod --version

      - name: Install CocoaPods dependencies
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/BuildDiagnostics"
          {
            pod install --no-repo-update || pod install --repo-update
          } 2>&1 | tee "${RUNNER_TEMP}/BuildDiagnostics/pod-install.log"

      - name: Build Simulator app
        timeout-minutes: 120
        run: |
          set -o pipefail
          derived_data_path="${RUNNER_TEMP}/DerivedData"
          diagnostics_path="${RUNNER_TEMP}/BuildDiagnostics"
          mkdir -p "${diagnostics_path}"

          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -sdk "${SDK}" \
            -destination "${DESTINATION}" \
            -derivedDataPath "${derived_data_path}" \
            -resultBundlePath "${diagnostics_path}/Build.xcresult" \
            -showBuildTimingSummary \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="${SIMULATOR_ARCH}" \
            build 2>&1 | tee "${diagnostics_path}/xcodebuild.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.SCHEME }}-Build-Logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/BuildDiagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Package Simulator app
        id: package
        run: |
          derived_data_path="${RUNNER_TEMP}/DerivedData"
          app_output_dir="${RUNNER_TEMP}/SimulatorApp"
          products_dir="${derived_data_path}/Build/Products/${CONFIGURATION}-iphonesimulator"
          app_path="${products_dir}/${SCHEME}.app"

          if [[ ! -d "${app_path}" || ! -f "${app_path}/Info.plist" ]]; then
            echo "::error::Main app product not found: ${app_path}"
            exit 1
          fi

          app_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Info.plist")"
          app_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app_path}/Info.plist")"
          if [[ -z "${app_bundle_id}" || "${app_bundle_id}" == *.xctrunner || "${app_executable}" != "${SCHEME}" || ! -f "${app_path}/${app_executable}" ]]; then
            echo "::error::Invalid main app identity: ${app_bundle_id} / ${app_executable}"
            exit 1
          fi
          echo "Packaging main app: ${app_path} (${app_bundle_id})"

          mkdir -p "${app_output_dir}"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          artifact_name="${SCHEME}-Latest-Simulator.app-${safe_ref}"
          legacy_artifact_prefix="${SCHEME}-Simulator.app-${safe_ref}-"
          artifact_zip="${app_output_dir}/${artifact_name}.zip"

          ditto -c -k --keepParent "${app_path}" "${artifact_zip}"

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "legacy_artifact_prefix=${legacy_artifact_prefix}" >> "${GITHUB_OUTPUT}"
          echo "artifact_zip=${artifact_zip}" >> "${GITHUB_OUTPUT}"

      - name: Delete previous Simulator app artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          LEGACY_ARTIFACT_PREFIX: ${{ steps.package.outputs.legacy_artifact_prefix }}
        run: |
          artifact_ids="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              --jq '.artifacts[] | select(.expired == false and (.name == env.ARTIFACT_NAME or (.name | startswith(env.LEGACY_ARTIFACT_PREFIX)))) | .id'
          )"

          if [[ -z "${artifact_ids}" ]]; then
            echo "No previous Simulator app artifacts found."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            echo "Deleting previous artifact id ${artifact_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_zip }}
          if-no-files-found: error
          retention-days: 14
