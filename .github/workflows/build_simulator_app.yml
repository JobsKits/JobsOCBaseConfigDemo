name: Build Simulator App

on:
  push:
    branches:
      - main
      - byPods
  pull_request:
    branches:
      - main
      - byPods
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator-app:
    runs-on: macos-15
    timeout-minutes: 150
    permissions:
      actions: write
      contents: read

    env:
      WORKSPACE: JobsOCBaseConfigDemo.xcworkspace
      SCHEME: JobsOCBaseConfigDemo
      CONFIGURATION: Debug
      SDK: iphonesimulator
      DESTINATION: generic/platform=iOS Simulator
      SIMULATOR_ARCH: arm64
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26 SDK
        run: |
          selected_developer_dir=""

          if [[ -n "${XCODE_26_DEVELOPER_DIR:-}" && -d "${XCODE_26_DEVELOPER_DIR}" ]]; then
            selected_developer_dir="${XCODE_26_DEVELOPER_DIR}"
          else
            latest_xcode="$(ruby -e 'puts Dir.glob("/Applications/Xcode_26*.app").max_by { |path| Gem::Version.new(File.basename(path)[/\d+(?:\.\d+)*/, 0]) }')"
            if [[ -n "${latest_xcode}" ]]; then
              selected_developer_dir="${latest_xcode}/Contents/Developer"
            fi
          fi

          if [[ -n "${selected_developer_dir}" ]]; then
            export DEVELOPER_DIR="${selected_developer_dir}"
            echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> "${GITHUB_ENV}"
          else
            echo "::error::Xcode 26 is required by this project but is unavailable on the runner."
            exit 1
          fi

          xcodebuild -version | tee "${RUNNER_TEMP}/xcode-version.txt"
          grep -Eq '^Xcode 26([.]|$)' "${RUNNER_TEMP}/xcode-version.txt"
          xcode-select -p

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          pod --version

      - name: Install CocoaPods dependencies
        timeout-minutes: 20
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/BuildDiagnostics"
          {
            pod install --no-repo-update || pod install --repo-update
          } 2>&1 | tee "${RUNNER_TEMP}/BuildDiagnostics/pod-install.log"

      - name: Build Simulator app
        timeout-minutes: 120
        run: |
          set -o pipefail
          derived_data_path="${RUNNER_TEMP}/DerivedData"
          diagnostics_path="${RUNNER_TEMP}/BuildDiagnostics"
          mkdir -p "${diagnostics_path}"

          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -sdk "${SDK}" \
            -destination "${DESTINATION}" \
            -derivedDataPath "${derived_data_path}" \
            -resultBundlePath "${diagnostics_path}/Build.xcresult" \
            -showBuildTimingSummary \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="${SIMULATOR_ARCH}" \
            build 2>&1 | tee "${diagnostics_path}/xcodebuild.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.SCHEME }}-Build-Logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/BuildDiagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Package Simulator app
        id: package
        run: |
          derived_data_path="${RUNNER_TEMP}/DerivedData"
          app_output_dir="${RUNNER_TEMP}/SimulatorApp"
          products_dir="${derived_data_path}/Build/Products/${CONFIGURATION}-iphonesimulator"
          app_path="$(find "${products_dir}" -maxdepth 1 -type d -name '*.app' -print -quit)"

          if [[ -z "${app_path}" ]]; then
            echo "::error::No .app product found in ${products_dir}"
            find "${derived_data_path}/Build/Products" -type d -name '*.app' -print || true
            exit 1
          fi

          mkdir -p "${app_output_dir}"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          artifact_name="${SCHEME}-Latest-Simulator.app-${safe_ref}"
          legacy_artifact_prefix="${SCHEME}-Simulator.app-${safe_ref}-"
          artifact_zip="${app_output_dir}/${artifact_name}.zip"

          ditto -c -k --keepParent "${app_path}" "${artifact_zip}"

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "legacy_artifact_prefix=${legacy_artifact_prefix}" >> "${GITHUB_OUTPUT}"
          echo "artifact_zip=${artifact_zip}" >> "${GITHUB_OUTPUT}"

      - name: Delete previous Simulator app artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          LEGACY_ARTIFACT_PREFIX: ${{ steps.package.outputs.legacy_artifact_prefix }}
        run: |
          artifact_ids="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              --jq '.artifacts[] | select(.expired == false and (.name == env.ARTIFACT_NAME or (.name | startswith(env.LEGACY_ARTIFACT_PREFIX)))) | .id'
          )"

          if [[ -z "${artifact_ids}" ]]; then
            echo "No previous Simulator app artifacts found."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            echo "Deleting previous artifact id ${artifact_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_zip }}
          if-no-files-found: error
          retention-days: 14
