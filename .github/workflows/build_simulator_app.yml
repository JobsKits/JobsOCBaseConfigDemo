name: Build Simulator App

on:
  push:
    branches:
      - main
      - byPods
  pull_request:
    branches:
      - main
      - byPods
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator-app:
    runs-on: macos-15
    timeout-minutes: 320
    permissions:
      actions: write
      contents: read

    env:
      WORKSPACE: JobsOCBaseConfigDemo.xcworkspace
      SCHEME: JobsOCBaseConfigDemo
      CONFIGURATION: Debug
      SDK: iphonesimulator
      DESTINATION: generic/platform=iOS Simulator
      JOBS_SIMULATOR_ONLY: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26 SDK
        run: |
          selected_developer_dir=""

          if [[ -n "${XCODE_26_DEVELOPER_DIR:-}" && -d "${XCODE_26_DEVELOPER_DIR}" ]]; then
            selected_developer_dir="${XCODE_26_DEVELOPER_DIR}"
          else
            latest_xcode="$(ruby -e 'puts Dir.glob("/Applications/Xcode_26*.app").max_by { |path| Gem::Version.new(File.basename(path)[/\d+(?:\.\d+)*/, 0]) }')"
            if [[ -n "${latest_xcode}" ]]; then
              selected_developer_dir="${latest_xcode}/Contents/Developer"
            fi
          fi

          if [[ -n "${selected_developer_dir}" ]]; then
            export DEVELOPER_DIR="${selected_developer_dir}"
            echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> "${GITHUB_ENV}"
          else
            echo "::error::Xcode 26 is required by this project but is not installed on the runner."
            exit 1
          fi

          xcode_version="$(xcodebuild -version)"
          echo "${xcode_version}"
          grep -Eq '^Xcode 26([.]|$)' <<< "${xcode_version}" || {
            echo "::error::Selected developer directory does not provide Xcode 26: ${DEVELOPER_DIR}"
            exit 1
          }
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"

      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"
          pod --version

      - name: Prepare test Simulator
        timeout-minutes: 10
        run: |
          ruby .github/tests/SimulatorRuntime/selection_regression.rb
          xcrun --sdk iphonesimulator --show-sdk-version > "${RUNNER_TEMP}/simulator-sdk-version.txt"
          xcrun simctl list runtimes -j > "${RUNNER_TEMP}/simulator-runtimes.json"
          xcrun simctl list devices available -j > "${RUNNER_TEMP}/simulator-devices.json"
          ruby .github/tests/SimulatorRuntime/select_simulator.rb \
            "$(cat "${RUNNER_TEMP}/simulator-sdk-version.txt")" \
            "${RUNNER_TEMP}/simulator-runtimes.json" \
            "${RUNNER_TEMP}/simulator-devices.json" \
            > "${RUNNER_TEMP}/simulator-selection.env"
          cat "${RUNNER_TEMP}/simulator-selection.env" >> "${GITHUB_ENV}"
          simulator_id="$(sed -n 's/^SIMULATOR_ID=//p' "${RUNNER_TEMP}/simulator-selection.env")"
          xcrun simctl bootstatus "${simulator_id}" -b

      - name: Install CocoaPods dependencies
        timeout-minutes: 30
        env:
          JOBS_SPECS_SOURCE: cdn
        run: |
          # 仅当前安装进程使用 HTTP/1.1，避免 Git 下载的 HTTP/2 断流。
          git_config_count="${GIT_CONFIG_COUNT:-0}"
          export "GIT_CONFIG_KEY_${git_config_count}=http.version"
          export "GIT_CONFIG_VALUE_${git_config_count}=HTTP/1.1"
          export GIT_CONFIG_COUNT="$((git_config_count + 1))"
          JOBS_POD_INSTALL_PURE=1 JOBS_POD_INSTALL_SKIP_VENDOR_PATCHES=1 pod install --no-repo-update || JOBS_POD_INSTALL_PURE=1 JOBS_POD_INSTALL_SKIP_VENDOR_PATCHES=1 pod install --repo-update
          ruby .github/tests/SimulatorPods/dependency_regression.rb --installed-root "${GITHUB_WORKSPACE}"

      - name: Skip Jobs local Xcode build timer hook in CI
        run: |
          sudo mkdir -p /Users/jobs/.xcode-build-timer
          sudo tee /Users/jobs/.xcode-build-timer/xbt-build-hook.sh >/dev/null <<'SCRIPT'
          #!/bin/sh
          echo "CI packaging skips Jobs local Xcode build timer hook: $*"
          exit 0
          SCRIPT
          sudo chmod +x /Users/jobs/.xcode-build-timer/xbt-build-hook.sh

      - name: Verify configuration and result guards
        timeout-minutes: 10
        run: |
          ruby ScriptsByPods/jobs_pods_stability_audit.rb/Tests/run_regression.rb
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/Tests/source_fingerprint_regression.rb
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/Tests/test_phase_regression.rb
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/Tests/readme_results_regression.rb
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/Tests/command_timeout_regression.rb
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/Tests/host_entitlements_regression.rb
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/Tests/pod_batch_regression.rb

      - name: Record ReactiveObjC build configuration
        timeout-minutes: 5
        run: |
          diagnostics_dir="${RUNNER_TEMP}/ReactiveObjCDiagnostics"
          ruby .github/tests/SimulatorPods/record_reactiveobjc.rb "${GITHUB_WORKSPACE}" "${diagnostics_dir}"
          xcodebuild -project Pods/Pods.xcodeproj -target ReactiveObjC \
            -configuration Debug -sdk iphonesimulator -showBuildSettings \
            > "${diagnostics_dir}/Debug-build-settings.log" 2>&1

      - name: Build every Jobs Pod in Debug and Release
        id: owned_pods_build
        timeout-minutes: 120
        run: |
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/jobs_pods_stability_verify.rb \
            --phase pods --batch-pods --build-timeout 3300 \
            --architecture arm64 --output "${RUNNER_TEMP}/JobsOCStability"

      - name: Record ReactiveObjC configuration after Pod builds
        if: ${{ always() && (steps.owned_pods_build.outcome == 'success' || steps.owned_pods_build.outcome == 'failure') }}
        timeout-minutes: 2
        run: |
          ruby .github/tests/SimulatorPods/record_reactiveobjc.rb \
            "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/ReactiveObjCDiagnosticsAfterBuild"

      - name: Run each Pod regression suite
        timeout-minutes: 120
        run: |
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/jobs_pods_stability_verify.rb \
            --phase tests --separate-test-builds \
            --build-timeout 1800 --test-timeout 600 \
            --architecture arm64 --simulator "${SIMULATOR_ID}" --output "${RUNNER_TEMP}/JobsOCStability"

      - name: Audit built Keychain test host
        timeout-minutes: 10
        run: |
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/Tests/host_entitlements_regression.rb \
            "${RUNNER_TEMP}/JobsOCStability/Products/Debug-iphonesimulator/AppHost-JobsBaseUI-Unit-Tests.app/AppHost-JobsBaseUI-Unit-Tests"

      - name: Build Simulator app
        timeout-minutes: 65
        run: |
          ruby ScriptsByPods/jobs_pods_stability_verify.rb/jobs_pods_stability_verify.rb \
            --phase app --build-timeout 1800 \
            --architecture arm64 --output "${RUNNER_TEMP}/JobsOCStability"

      - name: Package Simulator app
        id: package
        run: |
          app_output_dir="${RUNNER_TEMP}/SimulatorApp"
          products_dir="${RUNNER_TEMP}/JobsOCStability/Products/${CONFIGURATION}-iphonesimulator"
          app_path="${products_dir}/${SCHEME}.app"

          if [[ ! -d "${app_path}" || ! -f "${app_path}/Info.plist" ]]; then
            echo "::error::Main app product not found: ${app_path}"
            exit 1
          fi

          mkdir -p "${app_output_dir}"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          artifact_name="${SCHEME}-Latest-Simulator.app-${safe_ref}"
          legacy_artifact_prefix="${SCHEME}-Simulator.app-${safe_ref}-"
          artifact_zip="${app_output_dir}/${artifact_name}.zip"

          ditto -c -k --keepParent "${app_path}" "${artifact_zip}"

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "legacy_artifact_prefix=${legacy_artifact_prefix}" >> "${GITHUB_OUTPUT}"
          echo "artifact_zip=${artifact_zip}" >> "${GITHUB_OUTPUT}"

      - name: Delete previous Simulator app artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          LEGACY_ARTIFACT_PREFIX: ${{ steps.package.outputs.legacy_artifact_prefix }}
        run: |
          artifact_ids="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              --jq '.artifacts[] | select(.expired == false and (.name == env.ARTIFACT_NAME or (.name | startswith(env.LEGACY_ARTIFACT_PREFIX)))) | .id'
          )"

          if [[ -z "${artifact_ids}" ]]; then
            echo "No previous Simulator app artifacts found."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            echo "Deleting previous artifact id ${artifact_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_zip }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pod validation records
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: JobsPods-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/JobsOCStability/results.json
            ${{ runner.temp }}/JobsOCStability/configuration-audit.json
            ${{ runner.temp }}/JobsOCStability/*.log
            ${{ runner.temp }}/JobsOCStability/*.xcresult
            ${{ runner.temp }}/JobsOCStability/OwnedPodsBatch
            ${{ runner.temp }}/ReactiveObjCDiagnostics
            ${{ runner.temp }}/ReactiveObjCDiagnosticsAfterBuild
            ${{ runner.temp }}/JobsOCStability/Intermediates/Pods.build/*/ReactiveObjC.build/Objects-normal/arm64/*.resp
            ${{ runner.temp }}/JobsOCStability/Intermediates/Pods.build/*/ReactiveObjC.build/*.hmap
            ${{ runner.temp }}/JobsOCStability/Intermediates/Pods.build/*/*VFS*/*.yaml
            ${{ runner.temp }}/simulator-sdk-version.txt
            ${{ runner.temp }}/simulator-runtimes.json
            ${{ runner.temp }}/simulator-devices.json
            ${{ runner.temp }}/simulator-selection.env
          if-no-files-found: warn
          retention-days: 14
