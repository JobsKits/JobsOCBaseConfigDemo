name: Build Simulator App

on:
  push:
    branches:
      - main
      - byPods
  pull_request:
    branches:
      - main
      - byPods
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator-app:
    runs-on: xcode-27
    timeout-minutes: 320
    permissions:
      actions: write
      contents: read

    env:
      WORKSPACE: JobsOCBaseConfigDemo.xcworkspace
      SCHEME: JobsOCBaseConfigDemo
      CONFIGURATION: Debug
      SDK: iphonesimulator
      JOBS_SIMULATOR_ONLY: '1'
      JOBS_POD_INSTALL_SKIP_VENDOR_PATCHES: '1'
      DESTINATION: generic/platform=iOS Simulator
      SIMULATOR_ARCH: arm64
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify workflow configuration
        timeout-minutes: 2
        run: ruby .github/tests/WorkflowConfiguration/regression.rb

      - name: Verify explicit source membership
        timeout-minutes: 2
        run: |
          ruby .github/tests/ProjectMembership/regression.rb/regression.rb
          ruby .github/tests/ProjectMembership/validate_membership.rb/validate_membership.rb

      - name: Select Xcode 27 SDK
        run: |
          selected_developer_dir=""

          if [[ -n "${XCODE_27_DEVELOPER_DIR:-}" && -d "${XCODE_27_DEVELOPER_DIR}" ]]; then
            selected_developer_dir="${XCODE_27_DEVELOPER_DIR}"
          else
            latest_xcode="$(ruby -e 'puts Dir.glob("/Applications/Xcode_27*.app").max_by { |path| Gem::Version.new(File.basename(path)[/\d+(?:\.\d+)*/, 0]) }')"
            if [[ -n "${latest_xcode}" ]]; then
              selected_developer_dir="${latest_xcode}/Contents/Developer"
            fi
          fi

          if [[ -n "${selected_developer_dir}" ]]; then
            export DEVELOPER_DIR="${selected_developer_dir}"
            echo "DEVELOPER_DIR=${DEVELOPER_DIR}" >> "${GITHUB_ENV}"
          else
            echo "::error::Xcode 27 is required by this project but is not installed on the runner."
            exit 1
          fi

          xcode_version="$(xcodebuild -version)"
          echo "${xcode_version}"
          grep -Eq '^Xcode 27([.]|$)' <<< "${xcode_version}" || {
            echo "::error::Selected developer directory does not provide Xcode 27: ${DEVELOPER_DIR}"
            exit 1
          }
          echo "DEVELOPER_DIR=${DEVELOPER_DIR}"

      - name: Show build environment
        run: |
          diagnostics_path="${RUNNER_TEMP}/BuildDiagnostics"
          mkdir -p "${diagnostics_path}"
          sw_vers
          xcodebuild -version | tee "${diagnostics_path}/xcode-version.txt"
          xcrun --sdk iphonesimulator --show-sdk-version | tee "${diagnostics_path}/simulator-sdk-version.txt"
          xcode-select -p
          pod --version

      - name: Prepare test Simulator
        timeout-minutes: 10
        run: |
          ruby .github/tests/SimulatorRuntime/selection_regression.rb
          xcrun --sdk iphonesimulator --show-sdk-version > "${RUNNER_TEMP}/simulator-sdk-version.txt"
          xcrun simctl list runtimes -j > "${RUNNER_TEMP}/simulator-runtimes.json"
          xcrun simctl list devices available -j > "${RUNNER_TEMP}/simulator-devices.json"
          ruby .github/tests/SimulatorRuntime/select_simulator.rb \
            "$(cat "${RUNNER_TEMP}/simulator-sdk-version.txt")" \
            "${RUNNER_TEMP}/simulator-runtimes.json" \
            "${RUNNER_TEMP}/simulator-devices.json" \
            > "${RUNNER_TEMP}/simulator-selection.env"
          cat "${RUNNER_TEMP}/simulator-selection.env" >> "${GITHUB_ENV}"
          simulator_id="$(sed -n 's/^SIMULATOR_ID=//p' "${RUNNER_TEMP}/simulator-selection.env")"
          echo "JOBS_STABILITY_SIMULATOR=${simulator_id}" >> "${GITHUB_ENV}"
          xcrun simctl bootstatus "${simulator_id}" -b

      - name: Prepare Rust toolchain
        timeout-minutes: 10
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Build Rust OCR from source
        timeout-minutes: 30
        env:
          RUSTUP_TOOLCHAIN: '1.95.0'
        run: /bin/zsh "JobsOCBaseConfigDemo/业务逻辑/功能模块/Demo@RustOCR/SDK/JobsRustOCR/Scripts/BuildRustOCR.command" --non-interactive

      - name: Install CocoaPods dependencies
        timeout-minutes: 20
        env:
          JOBS_SPECS_SOURCE: cdn
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/BuildDiagnostics"
          {
            pod install --no-repo-update || pod install --repo-update
          } 2>&1 | tee "${RUNNER_TEMP}/BuildDiagnostics/pod-install.log"
          ruby .github/tests/SimulatorPods/dependency_regression.rb --installed-root "${GITHUB_WORKSPACE}"

      - name: Record ReactiveObjC build configuration
        timeout-minutes: 5
        run: |
          diagnostics_dir="${RUNNER_TEMP}/BuildDiagnostics/ReactiveObjC"
          ruby .github/tests/SimulatorPods/record_reactiveobjc.rb "${GITHUB_WORKSPACE}" "${diagnostics_dir}"
          xcodebuild -project Pods/Pods.xcodeproj -target ReactiveObjC \
            -configuration Debug -sdk iphonesimulator -showBuildSettings \
            > "${diagnostics_dir}/Debug-build-settings.log" 2>&1

      - name: Verify integrated component configuration
        timeout-minutes: 10
        run: |
          ruby ScriptsByPods/自动化测试相关脚本/jobs_pods_stability_verify.rb/Tests/integrated_mode_regression.rb/integrated_mode_regression.rb

      - name: Run integrated component XCTest and production harnesses
        timeout-minutes: 120
        run: |
          ruby ScriptsByPods/自动化测试相关脚本/jobs_pods_stability_verify.rb/jobs_pods_stability_verify.rb \
            --phase tests --architecture "${SIMULATOR_ARCH}" \
            --simulator "${JOBS_STABILITY_SIMULATOR}" \
            --output "${RUNNER_TEMP}/JobsComponentsStability"

      - name: Build Simulator app
        timeout-minutes: 120
        run: |
          set -o pipefail
          derived_data_path="${RUNNER_TEMP}/DerivedData"
          diagnostics_path="${RUNNER_TEMP}/BuildDiagnostics"
          mkdir -p "${diagnostics_path}"

          xcodebuild \
            -workspace "${WORKSPACE}" \
            -scheme "${SCHEME}" \
            -configuration "${CONFIGURATION}" \
            -sdk "${SDK}" \
            -destination "${DESTINATION}" \
            -derivedDataPath "${derived_data_path}" \
            -resultBundlePath "${diagnostics_path}/Build.xcresult" \
            -showBuildTimingSummary \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS="${SIMULATOR_ARCH}" \
            build 2>&1 | tee "${diagnostics_path}/xcodebuild.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.SCHEME }}-Build-Logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/BuildDiagnostics
            ${{ runner.temp }}/JobsComponentsStability/results.json
            ${{ runner.temp }}/JobsComponentsStability/configuration-audit.json
            ${{ runner.temp }}/JobsComponentsStability/*.log
            ${{ runner.temp }}/JobsComponentsStability/*.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Package Simulator app
        id: package
        run: |
          derived_data_path="${RUNNER_TEMP}/DerivedData"
          app_output_dir="${RUNNER_TEMP}/SimulatorApp"
          products_dir="${derived_data_path}/Build/Products/${CONFIGURATION}-iphonesimulator"
          app_path="${products_dir}/${SCHEME}.app"

          if [[ ! -d "${app_path}" || ! -f "${app_path}/Info.plist" ]]; then
            echo "::error::Main app product not found: ${app_path}"
            exit 1
          fi

          app_bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app_path}/Info.plist")"
          app_executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "${app_path}/Info.plist")"
          if [[ -z "${app_bundle_id}" || "${app_bundle_id}" == *.xctrunner || "${app_executable}" != "${SCHEME}" || ! -f "${app_path}/${app_executable}" ]]; then
            echo "::error::Invalid main app identity: ${app_bundle_id} / ${app_executable}"
            exit 1
          fi
          echo "Packaging main app: ${app_path} (${app_bundle_id})"

          mkdir -p "${app_output_dir}"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          artifact_name="${SCHEME}-Latest-Simulator.app-${safe_ref}"
          legacy_artifact_prefix="${SCHEME}-Simulator.app-${safe_ref}-"
          artifact_zip="${app_output_dir}/${artifact_name}.zip"

          ditto -c -k --keepParent "${app_path}" "${artifact_zip}"

          echo "artifact_name=${artifact_name}" >> "${GITHUB_OUTPUT}"
          echo "legacy_artifact_prefix=${legacy_artifact_prefix}" >> "${GITHUB_OUTPUT}"
          echo "artifact_zip=${artifact_zip}" >> "${GITHUB_OUTPUT}"

      - name: Delete previous Simulator app artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
          LEGACY_ARTIFACT_PREFIX: ${{ steps.package.outputs.legacy_artifact_prefix }}
        run: |
          artifact_ids="$(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
              --jq '.artifacts[] | select(.expired == false and (.name == env.ARTIFACT_NAME or (.name | startswith(env.LEGACY_ARTIFACT_PREFIX)))) | .id'
          )"

          if [[ -z "${artifact_ids}" ]]; then
            echo "No previous Simulator app artifacts found."
            exit 0
          fi

          while IFS= read -r artifact_id; do
            [[ -z "${artifact_id}" ]] && continue
            echo "Deleting previous artifact id ${artifact_id}"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done <<< "${artifact_ids}"

      - name: Upload Simulator app
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_zip }}
          if-no-files-found: error
          retention-days: 14
