<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#144d8e"><link rel="manifest" href="./manifest.webmanifest"><title data-jobs-i18n="Jobs PWA 离线实验">Jobs PWA 离线实验</title><style>
:root{color-scheme:light dark;--paper:Canvas;--ink:CanvasText}
:root[data-theme="light"]{color-scheme:light;--paper:#ffffff;--ink:#111115}
:root[data-theme="dark"]{color-scheme:dark;--paper:#161618;--ink:#f5f5f7}
*{box-sizing:border-box}
body{font:16px/1.5 -apple-system,sans-serif;font:-apple-system-body;margin:0;padding:16px;background:var(--paper);color:var(--ink);overflow-wrap:anywhere}
h3{margin:0 0 12px}
p{line-height:1.5;margin:12px 0}
/* 控件跟随字号伸高；按钮组可换行，避免窄屏把文字或触摸区域挤出页面。 */
.actions{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
button{flex:1 1 12rem;max-width:100%;min-height:44px;background:#144d8e;color:white;border:0;padding:12px 16px;border-radius:8px;font:inherit;line-height:1.4;white-space:normal;overflow-wrap:anywhere}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:0.8125em/1.5 ui-monospace,monospace;margin:12px 0 0}
</style></head><body><h3 data-jobs-i18n="Jobs 离线交互实验">Jobs 离线交互实验</h3><p id="mode"></p><div class="actions"><button id="increment" data-jobs-i18n="离线计数 +1">离线计数 +1</button></div><p id="count">当前计数：0</p><pre id="state"></pre><script>
// Jobs-owned lesson UI only; API names, URLs, and user drafts are never translated.
window.jobsT = key => window.jobsWebLocalization?.strings?.[key] ?? key;
window.jobsTF = (key, ...values) => {
  let i = 0;
  return window.jobsT(key).replace(/%@|%d/g, () => String(values[i++] ?? ''));
};
window.jobsSetLocalization = payload => {
  window.jobsWebLocalization = payload;
  document.documentElement.lang = payload.language || 'en';
  document.querySelectorAll('[data-jobs-i18n]').forEach(el => {
    el.textContent = window.jobsT(el.dataset.jobsI18n);
  });
  document.querySelectorAll('[data-jobs-i18n-aria]').forEach(el => {
    el.setAttribute('aria-label', window.jobsT(el.dataset.jobsI18nAria));
  });
  document.querySelectorAll('[data-jobs-i18n-value]').forEach(el => {
    const next = window.jobsT(el.dataset.jobsI18nValue);
    if (el.dataset.jobsPreviousValue === undefined || el.value === el.dataset.jobsPreviousValue) {
      el.value = next;
    }
    el.dataset.jobsPreviousValue = next;
  });
  window.jobsRenderLocalized?.();
};
document.addEventListener('DOMContentLoaded', () => {
  if (window.jobsWebLocalization) window.jobsSetLocalization(window.jobsWebLocalization);
});


const state=document.querySelector('#state');let count=0;
try{count=Number(localStorage.getItem('jobs-pwa-counter')||0)}catch(e){}
function render(){document.querySelector('#count').textContent=jobsT('当前计数：%d').replace('%d',String(count))}
window.jobsRenderLocalized=render;
render();document.querySelector('#increment').onclick=()=>{count++;try{localStorage.setItem('jobs-pwa-counter',String(count))}catch(e){}render()};
(async()=>{
 if(location.protocol==='file:'){document.querySelector('#mode').dataset.jobsI18n="Native bundled 离线包：本地文件直接加载，无 Service Worker。";document.querySelector('#mode').textContent=jobsT("Native bundled 离线包：本地文件直接加载，无 Service Worker。");state.dataset.jobsI18n="把本目录的 index.html、manifest.webmanifest、sw.js 部署到同一 HTTPS 目录，即可学习真实 SW。";state.textContent=jobsT("把本目录的 index.html、manifest.webmanifest、sw.js 部署到同一 HTTPS 目录，即可学习真实 SW。");return;}
 document.querySelector('#mode').dataset.jobsI18n="HTTP(S) PWA：首次在线安装 SW，重载后检查 controller，再断网普通重载。";document.querySelector('#mode').textContent=jobsT("HTTP(S) PWA：首次在线安装 SW，重载后检查 controller，再断网普通重载。");
 if(!('serviceWorker'in navigator)){state.dataset.jobsI18n="当前环境未开放 Service Worker；WKWebView 请核对 App-Bound Domains。";state.textContent=jobsT("当前环境未开放 Service Worker；WKWebView 请核对 App-Bound Domains。");return;}
 try{const registration=await navigator.serviceWorker.register('./sw.js');await navigator.serviceWorker.ready;state.textContent='注册 scope: '+registration.scope+'\ncontroller: '+!!navigator.serviceWorker.controller+'\nCache: '+JSON.stringify(await caches.keys())}catch(e){state.textContent=String(e)}
})();
</script></body></html>
